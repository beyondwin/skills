name: Documentation
description: Report a documentation or guidance defect for the three curated products
title: "[Docs]: "
labels: ["documentation"]
body:
  - type: markdown
    attributes:
      value: |
        Report a documentation issue for `korean-writing-editor`,
        `image-workbench`, or `how-it-works` only.

        Do not include personal Korean text, a private prompt, a private image,
        credentials, provider receipts, or generated media.

        Do not file a security report here. Use GitHub private vulnerability
        reporting instead of a public issue.
  - type: dropdown
    id: skill
    attributes:
      label: Area
      options:
        - korean-writing-editor
        - image-workbench
        - how-it-works
        - repository docs
    validations:
      required: true
  - type: textarea
    id: details
    attributes:
      label: What should change
      description: Quote the current wording and the correction. No personal text or private images.
    validations:
      required: true
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy
      options:
        - label: This report contains no personal text, private images, prompts, credentials, or receipts.
          required: true
        - label: This is not a security report. Security issues use private vulnerability reporting, not a public issue.
          required: true
