name: Bug
description: Report a behavior defect in one of the two curated skills
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Report a defect in `korean-writing-editor` or `image-workbench` only.

        Do not include personal Korean text, a private prompt, a private image,
        credentials, provider receipts, or generated media.

        Do not file a security report here. Use GitHub private vulnerability
        reporting instead of a public issue.
  - type: dropdown
    id: skill
    attributes:
      label: Skill
      options:
        - korean-writing-editor
        - image-workbench
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Exact reproduction
      description: Deterministic steps. Do not paste personal text or private images.
    validations:
      required: true
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy
      options:
        - label: This report contains no personal text, private images, prompts, credentials, or receipts.
          required: true
        - label: This is not a security report. Security issues use private vulnerability reporting, not a public issue.
          required: true
